# ═══════════════════════════════════════════════════════════
#   Thoth & Son — Jekyll config
# ═══════════════════════════════════════════════════════════

name:        "Thoth & Son"
title:       "Thoth & Son"
description: "Precisão. Cultura. Resultado."
url:         "https://thothandson.github.io"
baseurl:     ""
favicon:     "assets/favicon.ico"

# Conteúdo
permalink:   /posts/:year/:month/:day/:title/
markdown:    kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Autores
authors:
  thoth-son:
    name: Thoth & Son
    display_name: Thoth & Son
    description: "Software de autor."

# Plugins suportados pelo GitHub Pages
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-paginate

# Paginação
paginate:       6
paginate_path:  /posts/page:num/

# Build
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - package.json
  - package-lock.json
  - scripts
  - tests
  - vendor
  - .bundle
  - .github
